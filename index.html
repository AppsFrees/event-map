<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#753bd1">
<meta name="description" content="Eventmaps: descubre eventos y negocios cerca de ti.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eventmaps">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<title>Eventmaps — Descubre qué pasa cerca</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f6f4fa;--text:#242035;--muted:#615b72;--card:rgba(255,255,255,.98);--glass:rgba(255,255,255,.94);--line:rgba(47,30,77,.14);--map:#edf0f7;--shadow:0 18px 55px rgba(34,21,57,.16);--primary:#753bd1;--primary-text:#6630b7;--fs:16px}
html[data-theme=dark]{color-scheme:dark;--bg:#14111f;--text:#f5f2fc;--muted:#bdb5ce;--card:rgba(31,26,45,.99);--glass:rgba(31,26,45,.95);--line:rgba(255,255,255,.16);--map:#171b2b;--shadow:0 18px 55px #0006;--primary-text:#d0b5ff}
@media(prefers-color-scheme:dark){html[data-theme=auto]{color-scheme:dark;--bg:#14111f;--text:#f5f2fc;--muted:#bdb5ce;--card:rgba(31,26,45,.99);--glass:rgba(31,26,45,.95);--line:rgba(255,255,255,.16);--map:#171b2b;--shadow:0 18px 55px #0006;--primary-text:#d0b5ff}}
*{box-sizing:border-box}html{font-size:var(--fs)}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:var(--map);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:not-allowed;opacity:.55}:focus-visible{outline:3px solid #0e9aab!important;outline-offset:3px}html.dark-map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.92)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.skip-link{position:absolute;left:12px;top:-80px;z-index:8000;background:#753bd1;color:white;padding:12px 16px;border-radius:12px}.skip-link:focus{top:12px}
#map{position:absolute;inset:0;z-index:0;background:var(--map)}.leaflet-container{font-family:inherit}.leaflet-control-attribution{font-size:10px!important;background:#fffffff0!important;color:#475569!important;padding:3px 7px!important;border-radius:8px 0 0 0!important}.leaflet-control-attribution a{color:#334155!important}
.top-ui{position:absolute;z-index:900;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;max-width:680px;margin:auto}.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 6px 24px #22153914}.searchbox{min-height:58px;border-radius:20px;display:flex;align-items:center;padding:4px 7px 4px 15px;gap:5px;position:relative;z-index:5}.searchbox input{background:transparent;border:0;width:100%;min-width:0;color:var(--text);font-size:1rem;min-height:44px}.icon-btn{border:0;background:transparent;color:var(--text);width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}.icon-btn:hover{background:var(--line)}.suggest{position:absolute;left:0;right:0;top:64px;border-radius:18px;overflow:hidden;display:none;max-height:55dvh;overflow-y:auto;z-index:950;background:var(--card)}.suggest.show{display:block}.suggest button{display:flex;width:100%;text-align:left;gap:10px;padding:14px;border:0;background:transparent;color:var(--text);border-bottom:1px solid var(--line);font-size:.85rem;min-height:48px}.suggest button:hover,.suggest button:focus{background:var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding:12px 1px 6px}.chip{white-space:nowrap;border-radius:999px;padding:10px 15px;font-size:.78rem;font-weight:700;border:1px solid var(--line);background:var(--glass);color:var(--text);min-height:44px;box-shadow:0 3px 12px #22153909}.chip[aria-pressed=true]{background:#753bd1;color:white;border-color:#753bd1}#resultCount{background:var(--glass);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:.72rem;max-width:75%}
.fab-stack{position:absolute;z-index:900;right:14px;bottom:calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:10px;align-items:center}.fab{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;color:var(--text);font-size:20px}.fab.primary{background:linear-gradient(135deg,#6430b7,#8847d7);color:white;border:0;width:54px;height:54px}.bottom-left{position:absolute;z-index:900;left:14px;bottom:calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:calc(100% - 100px)}.add-btn{border:0;color:white;font-size:.8rem;font-weight:800;padding:14px 17px;border-radius:17px;background:linear-gradient(120deg,#6430b7,#8847d7);box-shadow:0 8px 24px #753bd138;min-height:48px}.account-btn{display:flex;align-items:center;gap:8px;border-radius:15px;padding:8px 12px 8px 8px;min-height:46px;color:var(--text);font-size:.78rem;font-weight:700;max-width:100%}#accountLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.avatar{width:30px;height:30px;border-radius:50%;background:#753bd1;color:white;display:grid;place-items:center;font-weight:800;font-size:.8rem;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}
.bubble-wrap{background:transparent;border:0}.bubble{position:relative;min-width:76px;max-width:118px;padding:9px 11px 11px;border-radius:20px;background:linear-gradient(145deg,#753bd1,#8750d0);color:white;box-shadow:0 8px 20px #24205b55;text-align:center;border:3px solid #d6c5f4;font-size:10px;font-weight:800;line-height:1.2}.bubble .emoji{display:block;font-size:20px;margin-bottom:3px}.bubble .map-logo{display:block;width:24px;height:24px;object-fit:cover;border-radius:50%;margin:0 auto 3px;border:2px solid white}.bubble:after{content:'';position:absolute;bottom:-7px;left:calc(50% - 7px);border-width:7px 7px 0;border-style:solid;border-color:#8750d0 transparent transparent}.bubble.free{border-color:#cbd5e1;background:linear-gradient(145deg,#475569,#64748b)}.bubble.free:after{border-top-color:#64748b}.bubble.standard{border-color:#22d3ee;background:linear-gradient(145deg,#0369a1,#0891b2)}.bubble.standard:after{border-top-color:#0891b2}.bubble.pro{border-color:#fbbf24;background:linear-gradient(145deg,#6d28d9,#9333ea);box-shadow:0 0 0 3px #fbbf2433,0 10px 26px #6d28d955}.bubble.pro:after{border-top-color:#9333ea}.bubble .fav{position:absolute;top:-8px;right:-8px;background:#e11d48;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px;border:2px solid white}.leaflet-marker-icon:focus-visible .bubble{outline:3px solid #0e9aab;outline-offset:3px}
.sheet{position:absolute;z-index:1000;left:0;right:0;bottom:0;max-height:86dvh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;border:1px solid var(--line);box-shadow:var(--shadow);transform:translateY(110%);transition:transform .22s ease;padding:12px 18px calc(22px + env(safe-area-inset-bottom));visibility:hidden;overscroll-behavior:contain}.sheet.open{transform:translateY(0);visibility:visible}.grab{width:42px;height:5px;border-radius:8px;background:var(--muted);opacity:.35;margin:0 auto 14px}.sheet-close{float:right;border:0;border-radius:13px;background:var(--bg);color:var(--text);width:44px;height:44px}.social{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;color:white;font-size:10px;font-weight:800;margin-right:6px}.gallery{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px}.gallery img{width:155px;height:105px;object-fit:cover;border-radius:16px;flex:none;border:1px solid var(--line);background:var(--bg)}.event-card,.review-card,.stat-card{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:10px}.section-title{font-size:.85rem;font-weight:800;margin:20px 0 9px}.muted{color:var(--muted)}
.main-btn{background:linear-gradient(125deg,#6430b7,#8847d7);color:white;border:0;border-radius:15px;padding:14px 16px;font-weight:800;width:100%;min-height:48px}.soft-btn{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:11px 13px;font-size:.78rem;font-weight:700;min-height:44px}.soft-btn[aria-pressed=true]{background:#753bd1;color:white;border-color:#753bd1}.link-btn{background:none;border:0;color:var(--primary-text);font-weight:700;font-size:.82rem;padding:10px 0;min-height:44px;text-decoration:underline}.modal-backdrop{position:absolute;inset:0;z-index:2000;background:rgba(14,9,26,.6);display:none;align-items:flex-end;justify-content:center;padding:12px}.modal-backdrop.show{display:flex}.modal{width:min(100%,620px);max-height:90dvh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);overscroll-behavior:contain}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label,.field .label{font-size:.78rem;font-weight:700}.field input,.field select,.field textarea,.input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-height:46px;font-size:1rem}.field textarea{min-height:85px;resize:vertical}.editor{min-height:110px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}[contenteditable=true] ul,[contenteditable=true] ol{padding-left:22px;list-style:disc}[contenteditable=true] p{margin:.35rem 0}.rich ul{list-style:disc;padding-left:20px}.rich ol{list-style:decimal;padding-left:20px}
.plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.plan{border:1px solid var(--line);background:var(--bg);border-radius:15px;padding:14px 8px;text-align:center;font-size:.7rem;cursor:pointer}.plan.selected{border:2px solid #753bd1;background:#753bd111}.plan strong{display:block;font-size:.82rem;margin-bottom:5px}.plan input{position:absolute;opacity:0}.plan:focus-within{outline:3px solid #0e9aab;outline-offset:2px}.toast{position:absolute;z-index:7000;top:calc(env(safe-area-inset-top) + 18px);left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:#242035;color:white;padding:12px 16px;border-radius:14px;font-size:.8rem;max-width:calc(100% - 30px);box-shadow:var(--shadow);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.panel{position:absolute;inset:0;z-index:3000;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(24px + env(safe-area-inset-bottom));display:none}.panel.show{display:block}.panel-inner{max-width:980px;margin:0 auto}.admin-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:.68rem;font-weight:800;padding:5px 9px;border-radius:999px;background:#753bd11c;color:var(--primary-text);white-space:nowrap}.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.pill.info{background:#dbeafe;color:#1e40af}.pill.gray{background:#e5e7eb;color:#374151}.danger{background:#dc2626!important;color:white!important;border-color:#dc2626!important}.success{background:#047857!important;color:white!important;border-color:#047857!important}.list-item{padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;background:transparent;color:var(--text);border-left:0;border-right:0;border-top:0;min-height:48px}.empty{text-align:center;padding:32px 14px;color:var(--muted);font-size:.85rem}.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;border-bottom:1px solid var(--line);margin-top:14px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;padding:11px 14px;font-size:.78rem;font-weight:700;min-height:44px}.tab[aria-selected=true]{background:#753bd1;color:white;border-color:#753bd1}.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.kpi .stat-card strong{font-size:1.6rem;display:block}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal-grid .dow{font-size:.65rem;font-weight:800;text-align:center;color:var(--muted);padding:4px 0}.cal-day{aspect-ratio:1/1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;font-size:.78rem;font-weight:700;position:relative;padding:0}.cal-day.out{opacity:.35}.cal-day.today{border:2px solid #753bd1}.cal-day[aria-pressed=true]{background:#753bd1;color:white}.cal-day .dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:2px}.cal-day .dots i{width:5px;height:5px;border-radius:50%;background:#f59e0b;display:block}#pickMap{height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}.banner{border-radius:15px;padding:14px;font-size:.8rem;margin:12px 0;border:1px solid var(--line)}.banner.warn{background:#fef3c7;color:#78350f}.banner.info{background:#e0e7ff;color:#312e81}table.simple{width:100%;border-collapse:collapse;font-size:.78rem}table.simple th,table.simple td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
#connectionNotice{position:fixed;z-index:7500;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 12px);margin:auto;max-width:620px;background:#332350;color:white;padding:12px 16px;border-radius:14px;font-size:.8rem;box-shadow:var(--shadow)}#connectionNotice[hidden]{display:none}
@media(min-width:700px){.modal-backdrop{align-items:center}.sheet{left:auto;right:18px;bottom:18px;width:430px;max-height:calc(100dvh - 36px);border-radius:24px}.top-ui{left:24px;right:auto;width:470px}.bottom-left{left:24px;bottom:24px}.fab-stack{right:24px;bottom:24px}}
@media(max-width:380px){.searchbox{padding-left:10px;gap:2px}.searchbox input{font-size:.9rem}.icon-btn{width:40px}.modal{padding:16px}.plan-grid{gap:5px}}
html.reduce-motion *,html.reduce-motion *:before,html.reduce-motion *:after{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<a href="#search" class="skip-link">Saltar a la búsqueda</a>
<main>
<h1 class="sr-only">Eventmaps — mapa de eventos y negocios cercanos</h1>
<div id="map" role="application" aria-label="Mapa de eventos. Usa Tab para recorrer los negocios del mapa o abre la vista de lista."></div>
<div class="top-ui">
<div class="searchbox glass" role="search">
<span aria-hidden="true">⌕</span><label for="search" class="sr-only">Buscar negocios, eventos o direcciones</label>
<input id="search" type="search" autocomplete="off" placeholder="Busca negocios, eventos o direcciones…" aria-controls="suggest" aria-expanded="false" aria-autocomplete="list">
<button id="clearSearch" class="icon-btn" aria-label="Limpiar búsqueda" title="Limpiar">✕</button>
<div id="suggest" class="suggest glass" role="listbox" aria-label="Sugerencias de búsqueda"></div>
</div>
<div class="chips" id="chips" role="toolbar" aria-label="Filtros"></div>
<div class="flex items-center justify-between mt-1 px-1 text-xs font-semibold muted"><span id="resultCount" aria-live="polite">Cargando eventos…</span><button id="geoFilterActiveBadge" class="hidden text-xs text-indigo-500 font-bold hover:underline" title="Limpiar filtro de ubicación"></button></div>
</div>
<div class="bottom-left"><button class="add-btn" id="addBusiness">＋ Agregar negocio</button><button class="account-btn glass" id="accountBtn" aria-haspopup="dialog"><span class="avatar" id="avatar" aria-hidden="true">?</span><span id="accountLabel">Iniciar sesión</span></button></div>
<div class="fab-stack"><button class="fab glass" id="calendarBtn" title="Calendario de eventos" aria-label="Calendario de eventos">📅</button><button class="fab glass" id="listBtn" title="Ver lista" aria-label="Ver lista de resultados">☷</button><button class="fab glass primary" id="gpsBtn" title="Mi ubicación" aria-label="Centrar el mapa en mi ubicación">⌖</button></div>
</main>
<section id="sheet" class="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetTitle"><div class="grab" aria-hidden="true"></div><button class="sheet-close" id="closeSheet" aria-label="Cerrar ficha">✕</button><div id="sheetContent"></div></section>
<div id="modalBackdrop" class="modal-backdrop"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<section id="panel" class="panel" role="dialog" aria-modal="true" aria-label="Panel"></section>
<div id="connectionNotice" role="status" aria-live="polite" hidden>Sin conexión. El mapa y algunas acciones necesitan internet.</div>
<script>
(() => {const notice=document.getElementById('connectionNotice');function update(){notice.hidden=navigator.onLine;}window.addEventListener('online',update);window.addEventListener('offline',update);update();})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>

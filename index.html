<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Eventmaps: descubre eventos y negocios cerca de ti." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Eventmaps" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Eventmaps — Descubre qué pasa cerca</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--bg:#f4f5fb;--text:#17172a;--muted:#5b6170;--card:rgba(255,255,255,.97);--glass:rgba(255,255,255,.88);--line:rgba(28,31,55,.14);--map:#edf0f7;--shadow:0 18px 55px rgba(20,20,50,.16);--primary:#4f46e5;--primary-text:#3730a3;--fs:16px}
    html[data-theme="dark"]{color-scheme:dark;--bg:#111321;--text:#f4f4fb;--muted:#b4b8c8;--card:rgba(27,30,47,.98);--glass:rgba(27,30,47,.9);--line:rgba(255,255,255,.14);--map:#171b2b;--shadow:0 18px 55px rgba(0,0,0,.42);--primary-text:#a5b4fc}
    @media(prefers-color-scheme:dark){html[data-theme="auto"]{color-scheme:dark;--bg:#111321;--text:#f4f4fb;--muted:#b4b8c8;--card:rgba(27,30,47,.98);--glass:rgba(27,30,47,.9);--line:rgba(255,255,255,.14);--map:#171b2b;--shadow:0 18px 55px rgba(0,0,0,.42);--primary-text:#a5b4fc}}
    html{font-size:var(--fs)}
    html.dark-map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.92)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:var(--map);color:var(--text)}
    button,input,select,textarea{font:inherit}button{cursor:pointer}
    :focus-visible{outline:3px solid #818cf8!important;outline-offset:2px}
    .skip-link{position:absolute;left:12px;top:-60px;z-index:6000;background:#4f46e5;color:#fff;padding:10px 14px;border-radius:10px;font-weight:700}.skip-link:focus{top:12px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    #map{position:absolute;inset:0;z-index:0;background-color:var(--map)}
    .leaflet-container{font-family:inherit}.leaflet-control-attribution{font-size:10px!important;background:rgba(255,255,255,.92)!important;color:#475569!important;padding:3px 7px!important;border-radius:8px 0 0 0!important}.leaflet-control-attribution a{color:#334155!important}
    .top-ui{position:absolute;z-index:900;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;max-width:680px;margin:auto}
    .glass{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 8px 28px rgba(25,25,55,.10)}
    .searchbox{height:54px;border-radius:18px;display:flex;align-items:center;padding:0 8px 0 15px;gap:8px;position:relative;z-index:5}.searchbox input{background:transparent;border:0;outline:0;width:100%;color:var(--text);font-size:.9rem}
    .icon-btn{border:0;background:transparent;color:var(--text);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}.icon-btn:hover{background:var(--line)}
    .suggest{position:absolute;left:0;right:0;top:60px;border-radius:16px;overflow:hidden;display:none;max-height:55dvh;overflow-y:auto;z-index:950;background:var(--card)}.suggest.show{display:block}
    .suggest button{display:flex;width:100%;text-align:left;gap:10px;padding:11px 14px;border:0;background:transparent;color:var(--text);border-bottom:1px solid var(--line);font-size:.82rem}.suggest button:hover,.suggest button:focus{background:var(--line)}
    .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 1px 5px}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border-radius:999px;padding:9px 14px;font-size:.75rem;font-weight:700;border:1px solid var(--line);background:var(--glass);color:var(--text);backdrop-filter:blur(12px)}.chip[aria-pressed="true"]{background:#4f46e5;color:white;border-color:#4f46e5}
    .fab-stack{position:absolute;z-index:900;right:14px;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:10px;align-items:center}
    .fab{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;color:var(--text);font-size:19px}.fab.primary{background:linear-gradient(135deg,#4f46e5,#9333ea);color:white;border:0;width:54px;height:54px}
    .bottom-left{position:absolute;z-index:900;left:14px;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
    .add-btn{border:0;color:white;font-size:.8rem;font-weight:800;padding:14px 17px;border-radius:17px;background:linear-gradient(120deg,#4f46e5,#9333ea);box-shadow:0 12px 28px #4f46e555;min-height:48px}
    .account-btn{display:flex;align-items:center;gap:8px;border-radius:15px;padding:8px 12px 8px 8px;min-height:44px;color:var(--text);font-size:.78rem;font-weight:700}.avatar{width:30px;height:30px;border-radius:50%;background:#4f46e5;color:#fff;display:grid;place-items:center;font-weight:800;font-size:.8rem;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}
    .bubble-wrap{background:transparent;border:0}.bubble{position:relative;min-width:76px;max-width:118px;padding:9px 11px 11px;border-radius:20px;background:linear-gradient(145deg,#4f46e5,#6366f1);color:#fff;box-shadow:0 8px 20px #24205b66;text-align:center;animation:float 2.8s ease-in-out infinite;border:3px solid #c7d2fe;font-size:10px;font-weight:800;line-height:1.2}.bubble .emoji{display:block;font-size:20px;margin-bottom:3px}.bubble .map-logo{display:block;width:24px;height:24px;object-fit:cover;border-radius:50%;margin:0 auto 3px;border:2px solid #fff}.bubble:after{content:"";position:absolute;bottom:-7px;left:calc(50% - 7px);border-width:7px 7px 0;border-style:solid;border-color:#6366f1 transparent transparent}.bubble.free{border-color:#cbd5e1;background:linear-gradient(145deg,#475569,#64748b)}.bubble.free:after{border-top-color:#64748b}.bubble.standard{border-color:#22d3ee;background:linear-gradient(145deg,#0369a1,#0891b2)}.bubble.standard:after{border-top-color:#0891b2}.bubble.pro{border-color:#fbbf24;background:linear-gradient(145deg,#6d28d9,#9333ea);box-shadow:0 0 0 3px #fbbf2433,0 10px 26px #6d28d988}.bubble.pro:after{border-top-color:#9333ea}
    .bubble .fav{position:absolute;top:-8px;right:-8px;background:#e11d48;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px;border:2px solid #fff}
    .leaflet-marker-icon:focus-visible .bubble{outline:3px solid #fbbf24;outline-offset:3px}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    html.reduce-motion *,html.reduce-motion *:before,html.reduce-motion *:after{animation:none!important;transition:none!important}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
    [contenteditable="true"] ul,[contenteditable="true"] ol{padding-left:22px;list-style:disc}[contenteditable="true"] p{margin:.35rem 0}
    .rich ul{list-style:disc;padding-left:20px}.rich ol{list-style:decimal;padding-left:20px}
    .sheet{position:absolute;z-index:1000;left:0;right:0;bottom:0;max-height:86dvh;overflow:auto;background:var(--card);border-radius:25px 25px 0 0;border:1px solid var(--line);box-shadow:var(--shadow);transform:translateY(110%);transition:transform .28s ease;padding:12px 18px calc(22px + env(safe-area-inset-bottom));visibility:hidden}.sheet.open{transform:translateY(0);visibility:visible}.grab{width:42px;height:5px;border-radius:8px;background:var(--muted);opacity:.35;margin:0 auto 14px}.sheet-close{float:right;border:0;border-radius:12px;background:var(--bg);color:var(--text);width:40px;height:40px}
    .social{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;color:white;font-size:10px;font-weight:800;margin-right:6px}.gallery{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px}.gallery img{width:155px;height:105px;object-fit:cover;border-radius:14px;flex:none;border:1px solid var(--line);background:var(--bg)}
    .event-card,.review-card,.stat-card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:10px}.section-title{font-size:.82rem;font-weight:800;margin:17px 0 8px}.muted{color:var(--muted)}
    .main-btn{background:#4f46e5;color:#fff;border:0;border-radius:15px;padding:14px 16px;font-weight:800;width:100%;min-height:48px}.main-btn:disabled{opacity:.55;cursor:not-allowed}
    .soft-btn{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:10px 12px;font-size:.75rem;font-weight:700;min-height:42px}.soft-btn[aria-pressed="true"]{background:#4f46e5;color:#fff;border-color:#4f46e5}
    .link-btn{background:none;border:0;color:var(--primary-text);font-weight:700;font-size:.82rem;padding:6px 0;text-decoration:underline}
    .modal-backdrop{position:absolute;inset:0;z-index:2000;background:rgba(8,10,25,.58);display:none;align-items:flex-end;justify-content:center;padding:12px}.modal-backdrop.show{display:flex}.modal{width:min(100%,620px);max-height:90dvh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
    .field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label,.field .label{font-size:.75rem;font-weight:700}.field input,.field select,.field textarea,.input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-height:44px}.field textarea{min-height:75px;resize:vertical}
    .editor{min-height:100px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
    .plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.plan{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 8px;text-align:center;font-size:.7rem;cursor:pointer}.plan.selected{border:2px solid #4f46e5;background:#4f46e511}.plan strong{display:block;font-size:.82rem;margin-bottom:5px}.plan input{position:absolute;opacity:0}
    .toast{position:absolute;z-index:7000;top:calc(env(safe-area-inset-top) + 18px);left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:#17172a;color:white;padding:12px 16px;border-radius:14px;font-size:.78rem;max-width:calc(100% - 30px);box-shadow:var(--shadow);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .panel{position:absolute;inset:0;z-index:3000;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(24px + env(safe-area-inset-bottom));display:none}.panel.show{display:block}.panel-inner{max-width:980px;margin:0 auto}
    .admin-card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0}.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .pill{font-size:.65rem;font-weight:800;padding:5px 8px;border-radius:999px;background:#4f46e51c;color:var(--primary-text);white-space:nowrap}.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.pill.info{background:#dbeafe;color:#1e40af}.pill.gray{background:#e5e7eb;color:#374151}
    .danger{background:#dc2626!important;color:#fff!important;border-color:#dc2626!important}.success{background:#047857!important;color:#fff!important;border-color:#047857!important}
    .list-item{padding:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;background:transparent;color:var(--text);border-left:0;border-right:0;border-top:0}.empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:.82rem}
    .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-top:14px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 13px;font-size:.78rem;font-weight:700}.tab[aria-selected="true"]{background:#4f46e5;color:#fff;border-color:#4f46e5}
    .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kpi .stat-card strong{font-size:1.4rem;display:block}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-grid .dow{font-size:.65rem;font-weight:800;text-align:center;color:var(--muted);padding:4px 0}.cal-day{aspect-ratio:1/1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;font-size:.78rem;font-weight:700;position:relative;padding:0}.cal-day.out{opacity:.35}.cal-day.today{border:2px solid #4f46e5}.cal-day[aria-pressed="true"]{background:#4f46e5;color:#fff}.cal-day .dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:2px}.cal-day .dots i{width:5px;height:5px;border-radius:50%;background:#f59e0b;display:block}
    #pickMap{height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
    .banner{border-radius:14px;padding:12px 14px;font-size:.8rem;margin:10px 0;border:1px solid var(--line)}.banner.warn{background:#fef3c7;color:#78350f}.banner.info{background:#e0e7ff;color:#312e81}
    table.simple{width:100%;border-collapse:collapse;font-size:.78rem}table.simple th,table.simple td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    @media(min-width:700px){.modal-backdrop{align-items:center}.sheet{left:auto;right:18px;bottom:18px;width:430px;max-height:calc(100dvh - 36px);border-radius:24px}.top-ui{left:24px;right:auto;width:470px}.bottom-left{left:24px;bottom:24px}.fab-stack{right:24px;bottom:24px}}
  </style>
</head>
<body>
<a href="#search" class="skip-link">Saltar a la búsqueda</a>
<main>
  <h1 class="sr-only">Eventmaps — mapa de eventos y negocios cercanos</h1>
  <div id="map" role="application" aria-label="Mapa de eventos. Usa Tab para recorrer los negocios del mapa o abre la vista de lista."></div>
  <div class="top-ui">
    <div class="searchbox glass" role="search">
      <span aria-hidden="true">⌕</span>
      <label for="search" class="sr-only">Buscar negocios, eventos o direcciones</label>
      <input id="search" type="search" autocomplete="off" placeholder="Busca negocios, eventos o una dirección…" aria-controls="suggest" aria-expanded="false" aria-autocomplete="list">
      <button id="geoFilterBtn" class="icon-btn" aria-label="Filtrar por ubicación geográfica" title="Filtrar por País, Departamento o Distrito">🗺️</button>
      <button id="clearSearch" class="icon-btn" aria-label="Limpiar búsqueda" title="Limpiar">✕</button>
      <div id="suggest" class="suggest glass" role="listbox" aria-label="Sugerencias de búsqueda"></div>
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="Filtros"></div>
    <div class="flex items-center justify-between mt-1 px-1 text-xs font-semibold muted">
      <span id="resultCount" aria-live="polite">Cargando eventos…</span>
      <button id="geoFilterActiveBadge" class="hidden text-xs text-indigo-500 font-bold hover:underline" title="Limpiar filtro de ubicación"></button>
    </div>
  </div>
  <div class="bottom-left">
    <button class="add-btn" id="addBusiness">＋ Agregar negocio</button>
    <button class="account-btn glass" id="accountBtn" aria-haspopup="dialog"><span class="avatar" id="avatar" aria-hidden="true">?</span><span id="accountLabel">Iniciar sesión</span></button>
  </div>
  <div class="fab-stack">
    <button class="fab glass" id="calendarBtn" title="Calendario de eventos" aria-label="Calendario de eventos">📅</button>
    <button class="fab glass" id="listBtn" title="Ver lista" aria-label="Ver lista de resultados">☷</button>
    <button class="fab glass primary" id="gpsBtn" title="Mi ubicación" aria-label="Centrar el mapa en mi ubicación">⌖</button>
  </div>
</main>
<section id="sheet" class="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetTitle"><div class="grab" aria-hidden="true"></div><button class="sheet-close" id="closeSheet" aria-label="Cerrar ficha">✕</button><div id="sheetContent"></div></section>
<div id="modalBackdrop" class="modal-backdrop"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<section id="panel" class="panel" role="dialog" aria-modal="true" aria-label="Panel"></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>

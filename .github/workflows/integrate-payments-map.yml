name: Integrar pagos y mapa
on:
  push:
    branches: [mejoras/pagos-mapa-whatsapp]
    paths:
      - .github/workflows/integrate-payments-map.yml
      - scripts/integrate-payments-map.py
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/mejoras/pagos-mapa-whatsapp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mejoras/pagos-mapa-whatsapp
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar integración y verificar sintaxis
        run: python3 scripts/integrate-payments-map.py
      - name: Guardar solo los cuatro archivos integrados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.js admin/index.html firestore.rules service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integrate editable payments, animated markers and WhatsApp'
          git push origin HEAD:refs/heads/mejoras/pagos-mapa-whatsapp
